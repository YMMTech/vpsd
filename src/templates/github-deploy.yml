name: Simploy production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: simploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run application checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/package.json ]; then
            cd app
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run --if-present test
            pnpm run build
          fi

      - name: Authenticate to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the application image
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          IMAGE_TAG="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          docker build --pull \
            --build-arg NEXT_PUBLIC_SUPABASE_URL \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --tag "$IMAGE_TAG" app
          docker push "$IMAGE_TAG"

      - name: Resolve the immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "Registry did not return an immutable image digest." >&2; exit 1 ;;
          esac
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST" >> "$GITHUB_ENV"

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer Simploy deployment assets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SIMPLOY_DEPLOY_PATH: ${{ vars.SIMPLOY_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          SIMPLOY_DEPLOY_PATH="${SIMPLOY_DEPLOY_PATH:-/home/simploy/app}"
          DEPLOY_PATH_B64="$(printf '%s' "$SIMPLOY_DEPLOY_PATH" | base64 | tr -d '\n')"
          tar -C simploy -cf - deploy.env compose.yml Caddyfile | ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "sh -c 'SIMPLOY_DEPLOY_PATH=\$(printf %s \"\$1\" | base64 -d); install -d -m 0755 \"\$SIMPLOY_DEPLOY_PATH\"; tar -C \"\$SIMPLOY_DEPLOY_PATH\" -xf -' sh '$DEPLOY_PATH_B64'"

      - name: Materialize Supabase runtime configuration when selected
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SIMPLOY_DEPLOY_PATH: ${{ vars.SIMPLOY_DEPLOY_PATH }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          SIMPLOY_DEPLOY_PATH="${SIMPLOY_DEPLOY_PATH:-/home/simploy/app}"
          DEPLOY_PATH_B64="$(printf '%s' "$SIMPLOY_DEPLOY_PATH" | base64 | tr -d '\n')"
          if [ -f app/lib/supabase/client.ts ]; then
            : "${NEXT_PUBLIC_SUPABASE_URL:?Configure NEXT_PUBLIC_SUPABASE_URL.}"
            : "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Configure NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY.}"
            umask 077
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" "${SUPABASE_SERVICE_ROLE_KEY:-}" | ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "SIMPLOY_DEPLOY_PATH_B64=$DEPLOY_PATH_B64 sh -c 'SIMPLOY_DEPLOY_PATH=\"\$(printf %s \"\$SIMPLOY_DEPLOY_PATH_B64\" | base64 -d)\"; umask 077; cat > \"\$SIMPLOY_DEPLOY_PATH/runtime.env\"'"
          else
            ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "SIMPLOY_DEPLOY_PATH_B64=$DEPLOY_PATH_B64 sh -c 'SIMPLOY_DEPLOY_PATH=\"\$(printf %s \"\$SIMPLOY_DEPLOY_PATH_B64\" | base64 -d)\"; rm -f \"\$SIMPLOY_DEPLOY_PATH/runtime.env\"'"
          fi
      - name: Authenticate the VPS to pull the release image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy the immutable release
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SIMPLOY_DEPLOY_PATH: ${{ vars.SIMPLOY_DEPLOY_PATH }}
          SIMPLOY_CADDY_CONFIG_PATH: ${{ vars.SIMPLOY_CADDY_CONFIG_PATH }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          SIMPLOY_DEPLOY_PATH="${SIMPLOY_DEPLOY_PATH:-/home/simploy/app}"
          SIMPLOY_CADDY_CONFIG_PATH="${SIMPLOY_CADDY_CONFIG_PATH:-/etc/caddy/Caddyfile}"
          DEPLOY_PATH_B64="$(printf '%s' "$SIMPLOY_DEPLOY_PATH" | base64 | tr -d '\n')"
          CADDY_PATH_B64="$(printf '%s' "$SIMPLOY_CADDY_CONFIG_PATH" | base64 | tr -d '\n')"
          IMAGE_REF_B64="$(printf '%s' "$IMAGE_REF" | base64 | tr -d '\n')"
          ssh -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "SIMPLOY_DEPLOY_PATH_B64=$DEPLOY_PATH_B64 SIMPLOY_CADDY_CONFIG_PATH_B64=$CADDY_PATH_B64 APP_IMAGE_B64=$IMAGE_REF_B64 sh -s" <<'REMOTE'
          set -eu
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          SIMPLOY_DEPLOY_PATH="$(printf '%s' "$SIMPLOY_DEPLOY_PATH_B64" | base64 -d)"
          SIMPLOY_CADDY_CONFIG_PATH="$(printf '%s' "$SIMPLOY_CADDY_CONFIG_PATH_B64" | base64 -d)"
          APP_IMAGE="$(printf '%s' "$APP_IMAGE_B64" | base64 -d)"
          export APP_IMAGE
          cd "$SIMPLOY_DEPLOY_PATH"
          docker compose --env-file deploy.env -f compose.yml up -d --pull always --remove-orphans
          set -a
          . ./deploy.env
          set +a
          sudo -n /usr/bin/install -D -m 0644 Caddyfile "$SIMPLOY_CADDY_CONFIG_PATH"
          sudo -n /usr/bin/env DOMAIN="$DOMAIN" APP_PORT="$APP_PORT" /usr/bin/caddy validate --config "$SIMPLOY_CADDY_CONFIG_PATH" --adapter caddyfile
          sudo -n /usr/bin/env DOMAIN="$DOMAIN" APP_PORT="$APP_PORT" /usr/bin/caddy reload --config "$SIMPLOY_CADDY_CONFIG_PATH" --adapter caddyfile
          REMOTE
