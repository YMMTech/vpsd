stages:
  - verify
  - build
  - deploy

verify_application:
  stage: verify
  image: node:22-alpine
  script:
    - |
      set -eu
      if [ -f app/package.json ]; then
        corepack enable
        pnpm --dir app install --frozen-lockfile
        pnpm --dir app test --if-present
        pnpm --dir app build --if-present
      fi

build_application_image:
  stage: build
  image: quay.io/buildah/stable:v1.39.3
  script:
    - |
      set -eu
      IMAGE_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      buildah bud --format oci --tag "$IMAGE_TAG" app
      buildah push --digestfile image-digest "$IMAGE_TAG" "docker://$IMAGE_TAG"
      DIGEST="$(cat image-digest)"
      case "$DIGEST" in
        sha256:*) ;;
        *) echo "Registry did not return an immutable image digest." >&2; exit 1 ;;
      esac
      printf 'IMAGE_REF=%s@%s\n' "$CI_REGISTRY_IMAGE" "$DIGEST" > image.env
  artifacts:
    reports:
      dotenv: image.env

deploy_production:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: build_application_image
      artifacts: true
  resource_group: production
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client tar
    - install -d -m 700 "$HOME/.ssh"
    - printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
    - chmod 600 "$HOME/.ssh/id_ed25519"
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
    - chmod 600 "$HOME/.ssh/known_hosts"
  script:
    - |
      set -eu
      tar -C simploy -cf - deploy.env compose.yml Caddyfile | ssh -p 22 -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
        set -eu
        : "${SIMPLOY_DEPLOY_PATH:?SIMPLOY_DEPLOY_PATH must be provided by the VPS environment}"
        install -d -m 0755 "$SIMPLOY_DEPLOY_PATH"
        tar -C "$SIMPLOY_DEPLOY_PATH" -xf -
      '
      printf '%s' "$CI_REGISTRY_PASSWORD" | ssh -p 22 -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "docker login $CI_REGISTRY -u '$CI_REGISTRY_USER' --password-stdin"
      ssh -p 22 -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "CI_REGISTRY='$CI_REGISTRY' APP_IMAGE='$IMAGE_REF' sh -s" <<'REMOTE'
      set -eu
      trap 'docker logout "$CI_REGISTRY" >/dev/null 2>&1 || true' EXIT
      : "${SIMPLOY_DEPLOY_PATH:?SIMPLOY_DEPLOY_PATH must be provided by the VPS environment}"
      : "${SIMPLOY_CADDY_CONFIG_PATH:?SIMPLOY_CADDY_CONFIG_PATH must be provided by the VPS environment}"
      cd "$SIMPLOY_DEPLOY_PATH"
      docker compose --env-file deploy.env -f compose.yml up -d --pull always --remove-orphans
      set -a
      . ./deploy.env
      set +a
      sudo install -D -m 0644 Caddyfile "$SIMPLOY_CADDY_CONFIG_PATH"
      sudo env DOMAIN="$DOMAIN" APP_PORT="$APP_PORT" caddy validate --config "$SIMPLOY_CADDY_CONFIG_PATH" --adapter caddyfile
      sudo env DOMAIN="$DOMAIN" APP_PORT="$APP_PORT" caddy reload --config "$SIMPLOY_CADDY_CONFIG_PATH" --adapter caddyfile
      REMOTE
